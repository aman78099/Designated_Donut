    <div>
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
        
            <tbody>
                {% for item in cart_items %}
                <tr>
                    <td style="text-align: center">
                        <img src="/static/images/{{ item[0] }}.jpg" width="100" class="orderimg">
                    </td>
                
                    <td>
                        {{ item[1] }}
                    </td>
                
                    <td>
                        ${{ item[2] }}
                    </td>
                
                    <td style="text-align: center">
                
                        <!-- Decrease -->
                        <form action="{{ url_for('decrease_cart', product_id=item[0]) }}" method="POST" style="display:inline;">
                            <button type="submit" class="decreasebutton">−</button>
                        </form>
                
                        {{ item[3] }}
                
                        <!-- Increase -->
                        <form action="{{ url_for('increase_cart', product_id=item[0]) }}" method="POST" style="display:inline;">
                            <button type="submit" class="increasebutton">+</button>
                        </form>
                
                        <!-- Remove -->
                        <form action="{{ url_for('remove_from_cart', product_id=item[0]) }}" method="POST" style="display:inline;" class="removebutton">                            <button type="submit">Remove</button>
                        </form>
                
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>




        
        <div class="checkout-box">

            <h2>Cart Total</h2>
        
            <p>Total: ${{ total_cost }}</p>
        
            <form action="{{ url_for('checkout') }}" method="POST">
                <button type="submit">Checkout</button>
            </form>
        
        </div>




    </div>
